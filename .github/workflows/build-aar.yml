- name: Build Universal AAR (works on both 4KB and 16KB devices)
        run: |
          # Patch android.sh to inject the 16KB-compatible linker flag
          # This makes .so files load on BOTH 4KB and 16KB kernel devices
          sed -i 's/LDFLAGS=""/LDFLAGS="-Wl,-z,max-page-size=16384"/' android.sh 2>/dev/null || true
          
          export LDFLAGS="-Wl,-z,max-page-size=16384"
          
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64
          
          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-universal.aar
