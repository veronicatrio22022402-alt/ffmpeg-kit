name: Build FFmpegKit AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Find where CMakeLists.txt with old VERSION is
        run: |
          echo "=== CMakeLists inside cpufeatures ==="
          ls -la $HOME/android-ndk-r22b/sources/android/cpufeatures/ 2>/dev/null || echo "Not found yet"

          echo "=== Searching ffmpeg-kit source for cpu-features CMakeLists ==="
          find . -name "CMakeLists.txt" | xargs grep -l "cmake_minimum_required" 2>/dev/null

          echo "=== Content of each found CMakeLists ==="
          find . -name "CMakeLists.txt" | while read f; do
            echo "--- $f ---"
            head -5 "$f"
          done

      - name: Setup Java 11
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download NDK r22b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r22b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r22b" >> $GITHUB_ENV

      - name: Find cpu-features CMakeLists.txt after NDK download
        run: |
          echo "=== cpufeatures folder contents ==="
          ls -la $HOME/android-ndk-r22b/sources/android/cpufeatures/

          echo "=== All CMakeLists.txt in NDK ==="
          find $HOME/android-ndk-r22b -name "CMakeLists.txt" | while read f; do
            echo "--- $f ---"
            head -3 "$f"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm cmake \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Build AAR (arm64-v8a only)
        run: |
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64

      - name: Print build.log on failure
        if: failure()
        run: |
          echo "========== BUILD LOG =========="
          find . -name "build.log" | while read f; do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Copy AAR
        run: cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-4kb.aar

      - name: Upload 4KB AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-4kb
          path: ffmpeg-kit-4kb.aar
          retention-days: 30
