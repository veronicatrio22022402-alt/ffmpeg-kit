name: Build FFmpegKit Universal AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Pre-clone cpu-features and fix cmake compatibility
        run: |
          mkdir -p src
          git clone --depth=1 --branch v0.8.0 \
            https://github.com/arthenica/cpu_features.git \
            src/cpu-features
          CMAKE_FILE="src/cpu-features/CMakeLists.txt"
          sed -i \
            's/cmake_minimum_required(VERSION [^)]*)/cmake_minimum_required(VERSION 3.5)/g' \
            "$CMAKE_FILE"
          sed -i 's/if\s*(BUILD_TESTING)/if(FALSE)/g' "$CMAKE_FILE"
          echo "=== Verifying cmake patches ==="
          grep -n "cmake_minimum_required\|BUILD_TESTING\|if(FALSE)" "$CMAKE_FILE"

      - name: Inject page-size linker flags into android.sh and scripts
        run: |
          python3 << 'PYEOF'
          import re, glob

          # These two flags together make every .so universal:
          #   max-page-size=16384  → PT_LOAD segments align to 16KB boundaries
          #   common-page-size=16384 → .bss / common data align to 16KB
          # 16KB is a multiple of 4KB, so mprotect() for GNU RELRO works on
          # both 4KB kernels (Poco F1, Android 5-14) and 16KB kernels (Android 15+).
          #
          # IMPORTANT: export LDFLAGS in the shell env does NOT work — android.sh
          # exports its own LDFLAGS internally, overriding the env var.
          # We inject into the lines containing "--hash-style=both" which is the
          # unique fingerprint of the LDFLAGS string android.sh assembles internally.
          # That string is what actually reaches the linker for every .so file.

          PAGE_FLAGS = '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
          targets = glob.glob('scripts/**/*.sh', recursive=True) + ['android.sh']
          patched = []

          for f in targets:
              try:
                  content = open(f).read()
              except Exception:
                  continue
              if 'max-page-size' in content:
                  print(f"  Already has page-size flags: {f}")
                  continue
              new = re.sub(r'(-Wl,--hash-style=both)', r'\1 ' + PAGE_FLAGS, content)
              if new != content:
                  open(f, 'w').write(new)
                  patched.append(f)
                  print(f"  Patched: {f}")

          if patched:
              print(f"\nInjected page-size flags into {len(patched)} file(s).")
              for f in patched:
                  for i, line in enumerate(open(f).read().splitlines(), 1):
                      if 'max-page-size' in line:
                          print(f"  {f}:{i}: {line.strip()}")
          else:
              print("\nWARNING: --hash-style=both not found. Dumping LDFLAGS lines for debug:")
              for f in targets:
                  try:
                      content = open(f).read()
                  except Exception:
                      continue
                  for i, line in enumerate(content.splitlines(), 1):
                      if 'LDFLAGS' in line:
                          print(f"  {f}:{i}: {line.strip()}")
          PYEOF

      - name: Patch all clang 18 and NDK r27c compatibility issues
        run: |
          python3 << 'PYEOF'
          import os, glob, datetime

          BUILD_DATE = datetime.datetime.now().strftime('%Y%m%d')
          print(f"BUILD_DATE = {BUILD_DATE}")

          CFLAGS = [
              '-Wno-pointer-sign',
              '-Wno-single-bit-bitfield-constant-conversion',
              f'-DFFMPEG_KIT_BUILD_DATE={BUILD_DATE}',
          ]
          LDFLAGS_MK = [
              '-Wl,-z,max-page-size=16384',
              '-Wl,-z,common-page-size=16384',
          ]
          MARKER = 'clang18-pagesz-fix'

          def patch_application_mk(path):
              content = open(path).read()
              if MARKER in content:
                  print(f"  Already patched: {path}")
                  return
              additions = f'\n# {MARKER}\n'
              for flag in CFLAGS:
                  additions += f'APP_CFLAGS += {flag}\n'
              for flag in LDFLAGS_MK:
                  additions += f'APP_LDFLAGS += {flag}\n'
              open(path, 'a').write(additions)
              print(f"  Patched Application.mk: {path}")

          def patch_android_mk(path):
              content = open(path).read()
              if MARKER in content:
                  print(f"  Already patched: {path}")
                  return
              cflag_line = 'LOCAL_CFLAGS += ' + ' '.join(CFLAGS)
              ldflag_line = 'LOCAL_LDFLAGS += ' + ' '.join(LDFLAGS_MK)
              lines = content.splitlines(keepends=True)
              out = []
              for line in lines:
                  out.append(line)
                  if line.strip().startswith('LOCAL_MODULE') and ':=' in line:
                      out.append(f'# {MARKER}\n')
                      out.append(cflag_line + '\n')
                      out.append(ldflag_line + '\n')
              open(path, 'w').writelines(out)
              print(f"  Patched Android.mk: {path}")

          def prepend_pragma(path, pragma_flag):
              pragma = f'#pragma clang diagnostic ignored "{pragma_flag}"\n'
              content = open(path).read()
              if pragma not in content:
                  open(path, 'w').write(pragma + content)
                  print(f"  Prepended pragma to {path}")

          for f in glob.glob('**/Application.mk', recursive=True):
              patch_application_mk(f)
          for f in glob.glob('**/Android.mk', recursive=True):
              patch_android_mk(f)
          for f in glob.glob('**/ffmpegkit.c', recursive=True):
              prepend_pragma(f, '-Wpointer-sign')
          for f in glob.glob('**/fftools_ffmpeg_mux_init.c', recursive=True):
              prepend_pragma(f, '-Wsingle-bit-bitfield-constant-conversion')

          print('\nAll patches applied.')
          PYEOF

      - name: Build Universal AAR
        run: |
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64
          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-universal.aar

      - name: Verify universal compatibility
        run: |
          python3 << 'PYEOF'
          import struct, zipfile

          # THE CORRECT VERIFICATION LOGIC:
          #
          # The Poco F1 crash happens because bionic's mprotect() for GNU RELRO
          # rounds RELRO's start address DOWN to the nearest page boundary (4KB on
          # a 4KB kernel, 16KB on a 16KB kernel), then calls mprotect on that range.
          # If that rounded address falls in an unmapped gap between PT_LOAD segments,
          # mprotect returns ENOMEM and dlopen fails.
          #
          # With 16KB-aligned PT_LOAD segments:
          #   - All PT_GNU_RELRO segments are contained within a PT_LOAD segment
          #   - There are no sub-16KB gaps between PT_LOAD segments
          #   - Therefore PAGE_START(RELRO_vaddr, 4096) always falls within a
          #     mapped PT_LOAD region → mprotect succeeds on 4KB kernels (Poco F1)
          #   - PAGE_START(RELRO_vaddr, 16384) also falls within a mapped PT_LOAD
          #     region → mprotect succeeds on 16KB kernels (Android 15+)
          #
          # The correct check is therefore: PT_LOAD align == 16384.
          # Checking RELRO vaddr % 16384 == 0 is WRONG and too strict.

          def inspect(data):
              if data[:4] != b'\x7fELF' or data[4] != 2:
                  return None
              e_phoff     = struct.unpack_from('<Q', data, 32)[0]
              e_phentsize = struct.unpack_from('<H', data, 54)[0]
              e_phnum     = struct.unpack_from('<H', data, 56)[0]
              loads = []
              relro_vaddr = None
              for i in range(e_phnum):
                  off     = e_phoff + i * e_phentsize
                  p_type  = struct.unpack_from('<I', data, off)[0]
                  p_vaddr = struct.unpack_from('<Q', data, off + 16)[0]
                  p_memsz = struct.unpack_from('<Q', data, off + 40)[0]
                  p_align = struct.unpack_from('<Q', data, off + 48)[0]
                  if p_type == 1:
                      loads.append((p_vaddr, p_memsz, p_align))
                  if p_type == 0x6474e552:
                      relro_vaddr = p_vaddr
              return loads, relro_vaddr

          print("=== Universal compatibility verification ===")
          print(f"  {'Library':<35} {'PT_LOAD':>8} {'RELRO@4KB':>11} {'RELRO@16KB':>11}  Result")
          all_ok = True

          with zipfile.ZipFile('ffmpeg-kit-universal.aar') as z:
              for name in sorted(z.namelist()):
                  if not name.endswith('.so'):
                      continue
                  result = inspect(z.read(name))
                  if result is None:
                      continue
                  loads, relro_vaddr = result
                  lib = name.split('/')[-1]

                  if not loads:
                      print(f"  {lib:<35}  (no PT_LOAD segments)")
                      continue

                  max_align = max(a for _, _, a in loads)

                  # Core check: PT_LOAD must be 16KB aligned
                  align_ok = (max_align == 16384)

                  # Bonus check: simulate mprotect for both kernel types
                  relro_4kb_ok  = True
                  relro_16kb_ok = True
                  if relro_vaddr is not None:
                      pg4  = relro_vaddr & ~0xFFF
                      pg16 = relro_vaddr & ~0x3FFF
                      relro_4kb_ok  = any(b <= pg4  < b + s for b, s, _ in loads)
                      relro_16kb_ok = any(b <= pg16 < b + s for b, s, _ in loads)

                  ok = align_ok and relro_4kb_ok and relro_16kb_ok
                  if not ok:
                      all_ok = False

                  align_str   = f"{max_align//1024}KB"
                  r4_str  = "ok" if relro_4kb_ok  else "FAIL"
                  r16_str = "ok" if relro_16kb_ok else "FAIL"
                  flag = "✅" if ok else "❌"
                  print(f"  {lib:<35} {align_str:>8} {r4_str:>11} {r16_str:>11}  {flag}")

          print()
          if all_ok:
              print("✅  All .so files are universal. Safe on Poco F1 (4KB) and Android 15+ (16KB).")
          else:
              print("❌  Compatibility issues detected. PT_LOAD must be 16KB aligned.")
              raise SystemExit(1)
          PYEOF

      - name: Print build.log on failure
        if: failure()
        run: |
          find . -name "build.log" -exec cat {} \;

      - name: Upload Universal AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-universal
          path: ffmpeg-kit-universal.aar
          retention-days: 30
