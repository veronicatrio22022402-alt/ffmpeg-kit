name: Build FFmpegKit Universal AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 11
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Pre-clone cpu-features and patch ALL CMakeLists.txt files
        run: |
          mkdir -p src
          git clone --depth=1 --branch v0.8.0 \
            https://github.com/arthenica/cpu_features.git \
            src/cpu-features

          echo "=== All CMakeLists.txt files found ==="
          find src/cpu-features -name "CMakeLists.txt"

          echo "=== Patching ALL of them ==="
          find src/cpu-features -name "CMakeLists.txt" -exec \
            sed -i 's/cmake_minimum_required(VERSION [0-9][0-9.]*/cmake_minimum_required(VERSION 3.5/g' {} \;

          echo "=== Verifying patches ==="
          find src/cpu-features -name "CMakeLists.txt" -exec grep "cmake_minimum_required" {} \;

          echo "✅ All CMakeLists.txt files patched"

      - name: Build Universal AAR (4KB + 16KB compatible)
        run: |
          export LDFLAGS="-Wl,-z,max-page-size=16384"

          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64

          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-universal.aar

      - name: Print build.log on failure
        if: failure()
        run: |
          echo "========== BUILD LOG =========="
          find . -name "build.log" | while read f; do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Upload Universal AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-universal
          path: ffmpeg-kit-universal.aar
          retention-days: 30
