name: Build FFmpegKit AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Extract NDK r25c directly
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25c" >> $GITHUB_ENV

      - name: Verify cpu-features source exists
        run: |
          ls $HOME/android-ndk-r25c/sources/android/cpufeatures/
          echo "cpu-features source confirmed ✅"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git cmake nasm yasm \
            build-essential gcc g++

      - name: Build 4KB AAR (Standard - works Android 5+)
        run: |
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-x86 \
            --disable-x86-64
          cp prebuilt/android-aar/ffmpeg-kit.aar ffmpeg-kit-4kb.aar

      - name: Upload 4KB AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-4kb
          path: ffmpeg-kit-4kb.aar
          retention-days: 30
