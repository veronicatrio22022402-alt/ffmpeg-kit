name: Build FFmpegKit AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 11
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download NDK r22b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r22b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r22b" >> $GITHUB_ENV
          
      - name: Find cpu-features CMakeLists.txt location
        run: |
          echo "=== Searching for CMakeLists.txt ==="
          find $HOME/android-ndk-r22b -name "CMakeLists.txt" | head -20
          echo "=== Searching for cpu-features folder ==="
          find $HOME/android-ndk-r22b -type d -name "cpufeatures" -o -type d -name "cpu-features" | head -10
          echo "=== NDK sources folder ==="
          ls $HOME/android-ndk-r22b/sources/android/ 2>/dev/null || echo "sources/android not found"
     
      - name: Patch cpu-features CMakeLists.txt for CMake 3.5+
        run: |
          find $HOME/android-ndk-r22b -name "CMakeLists.txt" -path "*/cpu-features/*" \
            -exec sed -i 's/cmake_minimum_required(VERSION 2\.[0-9]\+)/cmake_minimum_required(VERSION 3.5)/g' {} \;
          echo "Patched files:"
          grep -r "cmake_minimum_required" $HOME/android-ndk-r22b/sources/android/cpufeatures/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm cmake \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Build AAR (arm64-v8a only)
        run: |
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64

      - name: Print build.log on failure
        if: failure()
        run: |
          echo "========== BUILD LOG =========="
          find . -name "build.log" | while read f; do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Copy AAR
        run: cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-4kb.aar

      - name: Upload 4KB AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-4kb
          path: ffmpeg-kit-4kb.aar
          retention-days: 30
