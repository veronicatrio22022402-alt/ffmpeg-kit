name: Build FFmpegKit Universal AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 11
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r27c" >> $GITHUB_ENV

      - name: Patch cpu-features build script to fix CMake 3.31 compatibility
        run: |
          # Find the cpu-features build script inside ffmpeg-kit
          echo "=== Searching for cpu-features build script ==="
          find . -name "cpu-features.sh" | head -5
          find . -name "*.sh" | xargs grep -l "cpu.features\|cpu_features" 2>/dev/null | head -10

          # Patch every cmake invocation in any script to include the fix
          find . -name "*.sh" | xargs grep -l "cmake" 2>/dev/null | while read f; do
            echo "Patching cmake calls in: $f"
            sed -i 's/cmake \(.*\)-DCMAKE_TOOLCHAIN/cmake \1-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN/g' "$f"
            sed -i 's/cmake -DCMAKE/cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE/g' "$f"
          done

          echo "=== Verifying patch ==="
          grep -r "CMAKE_POLICY_VERSION_MINIMUM" . --include="*.sh" | head -10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Build Universal AAR (4KB + 16KB compatible)
        run: |
          export LDFLAGS="-Wl,-z,max-page-size=16384"

          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64

          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-universal.aar

      - name: Print build.log on failure
        if: failure()
        run: |
          echo "========== BUILD LOG =========="
          find . -name "build.log" | while read f; do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Upload Universal AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-universal
          path: ffmpeg-kit-universal.aar
          retention-days: 30
