name: Build FFmpegKit Universal AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4.2.2

      - name: Setup Java 11
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl git doxygen nasm \
            gcc g++ gperf texinfo yasm \
            bison autogen wget autopoint \
            meson ninja-build ragel groff \
            gtk-doc-tools libtasn1-6-dev \
            build-essential

      - name: Pre-clone cpu-features and surgically remove googletest
        run: |
          mkdir -p src
          git clone --depth=1 --branch v0.8.0 \
            https://github.com/arthenica/cpu_features.git \
            src/cpu-features

          python3 << 'PYEOF'
          import re

          with open('src/cpu-features/CMakeLists.txt', 'r') as f:
              content = f.read()

          # Fix 1: cmake_minimum_required version
          content = re.sub(
              r'cmake_minimum_required\s*\(\s*VERSION\s+[0-9]+\.[0-9.]*\s*\)',
              'cmake_minimum_required(VERSION 3.5)',
              content
          )

          # Fix 2: Remove include(FetchContent)
          content = re.sub(r'include\s*\(\s*FetchContent\s*\)', '', content)

          # Fix 3: Remove multi-line FetchContent blocks for googletest
          def remove_cmake_block(text, func_name):
              result = []
              i = 0
              pattern = re.compile(r'[ \t]*' + re.escape(func_name) + r'\s*\(', re.IGNORECASE)
              while i < len(text):
                  m = pattern.match(text, i)
                  if m:
                      paren_start = m.end() - 1
                      depth = 1
                      j = paren_start + 1
                      while j < len(text) and depth > 0:
                          if text[j] == '(':
                              depth += 1
                          elif text[j] == ')':
                              depth -= 1
                          j += 1
                      block = text[i:j]
                      if 'googletest' in block.lower() or 'gtest' in block.lower():
                          i = j
                          while i < len(text) and text[i] in '\n\r':
                              i += 1
                          continue
                  result.append(text[i])
                  i += 1
              return ''.join(result)

          content = remove_cmake_block(content, 'FetchContent_Declare')
          content = remove_cmake_block(content, 'FetchContent_MakeAvailable')

          # Fix 4: Comment out any remaining gtest references
          lines = content.split('\n')
          clean = []
          for line in lines:
              if re.search(r'\bgtest\b|\bgoogletest\b', line, re.IGNORECASE) \
                 and not line.strip().startswith('#'):
                  clean.append('# ' + line)
              else:
                  clean.append(line)
          content = '\n'.join(clean)

          with open('src/cpu-features/CMakeLists.txt', 'w') as f:
              f.write(content)

          print("Patched successfully")
          PYEOF

          echo "=== Patched file lines 185-210 ==="
          sed -n '185,210p' src/cpu-features/CMakeLists.txt

      - name: Build Universal AAR (4KB + 16KB compatible)
        run: |
          export LDFLAGS="-Wl,-z,max-page-size=16384"
          ./android.sh \
            --enable-gpl \
            --enable-x264 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64
          cp prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar ffmpeg-kit-universal.aar

      - name: Print build.log on failure
        if: failure()
        run: |
          find . -name "build.log" -exec cat {} \;

      - name: Upload Universal AAR
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-kit-universal
          path: ffmpeg-kit-universal.aar
          retention-days: 30
